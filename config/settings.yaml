# Konfiguracja Sygnalisty GPW. Sekrety trzymamy w .env, nie tutaj.

db_path: data/gpw_signals.sqlite
tickers_csv: data/gpw_tickers.csv
timezone: Europe/Warsaw

schedule:
  poll_minutes: 5                # co ile minut sprawdzać newsy
  active_from: "08:00"           # ESPI spływają też przed sesją
  active_to: "17:10"
  prices_at: "18:15"             # import notowań z archiwum GPW (po publikacji pliku dziennego)
  tracker_at: "18:30"            # sprawdzanie wyników sygnałów po imporcie notowań
  # Dni bez sesji: https://www.gpw.pl/szczegoly-sesji (odczyt 2026-11-25); dopisz kolejny rok po publikacji
  holidays:
    - "2026-01-01"
    - "2026-01-06"
    - "2026-04-03"
    - "2026-04-06"
    - "2026-05-01"
    - "2026-06-04"
    - "2026-11-11"
    - "2026-12-24"
    - "2026-12-25"
    - "2026-12-31"
    - "2027-01-01"
    - "2027-01-06"
    - "2027-03-26"
    - "2027-03-29"
    - "2027-05-03"
    - "2027-05-27"
    - "2027-11-01"
    - "2027-11-11"
    - "2027-12-24"
    - "2027-12-31"

sources:
  # Każdy feed: name, kind (espi|portal|broker|macro), url, priority (wyżej = ważniejszy).
  # URL-e są przykładowe – ZWERYFIKUJ je i regulaminy serwisów przed użyciem.
  rss:
    - {name: bankier-espi, kind: espi, priority: 3, url: "https://www.bankier.pl/rss/espi.xml"}
    - {name: bankier-wiadomosci, kind: portal, priority: 1, url: "https://www.bankier.pl/rss/wiadomosci.xml"}
    - {name: bankier-rekomendacje, kind: broker, priority: 2, url: "https://www.bankier.pl/rss/rekomendacje.xml"}
  # Po tych rdzeniach news z portalu traktujemy jako rekomendację DM (wszystkie rdzenie frazy muszą wystąpić)
  broker_keywords: ["rekomendac", "cen docelow", "kupuj", "akumuluj"]
  # Kalendarz makro/wyników – ręcznie lub z pliku (YYYY-MM-DD: opis)
  macro_calendar_file: data/macro_calendar.yaml
  # Terminy raportów okresowych z komunikatów ESPI: pobiera stronę komunikatu i zapisuje daty do pliku.
  # Wyłączone, dopóki nie sprawdzisz regulaminu serwisu, z którego pochodzi feed ESPI (#7).
  fetch_report_schedules: false
  report_calendar_file: data/report_calendar.yaml

market:
  # csv   – pliki {csv_dir}/{symbol}.csv; domyślnie zasila je import z archiwum GPW
  #         (python -m gpw_signals fetch-prices), ale możesz je zapisywać z dowolnego źródła
  # stooq – pobieranie CSV ze stooq; obecnie serwis odpowiada stroną anty-botową
  provider: csv
  csv_dir: data/prices
  # Darmowe dane dzienne z gpw.pl/archiwum-notowan (opóźnione, nieskorygowane o splity).
  # Przed publicznym kanałem sprawdź warunki korzystania z danych GPW (#16).
  gpw_archive_url: "https://www.gpw.pl/archiwum-notowan?fetch=1&type={type}&instrument=&date={date}"
  raw_dir: data/raw/gpw          # cache surowych plików – ponowny import bez sieci
  min_interval_s: 1.5            # odstęp między zapytaniami do gpw.pl
  index_symbols: {WIG20: wig20, WIG: wig}
  max_data_age_days: 5           # starsze notowania = dane nieaktualne, spółka pomijana
  max_jump_pct: 40.0             # większy skok dzienny = możliwy split, spółka pomijana
  stooq_url: "https://stooq.pl/q/d/l/?s={symbol}&i=d"
  history_days: 250
  index_symbol: "wig20"

agent:
  provider: anthropic            # anthropic | ollama (lokalny model, bez kosztów API)
  model: claude-opus-5-5         # dla ollama np. SpeakLeash/bielik-11b-v3.0-instruct:<tag>
  effort: high                   # low | medium | high | xhigh | max
  max_tokens: 16000
  max_tool_rounds: 8
  use_fallbacks: true            # serwerowy fallback przy odmowie modelu
  base_url: "http://localhost:11434"  # poniżej tylko dla ollama
  num_ctx: 8192
  timeout_s: 300

levels:
  atr_period: 14
  entry_below_atr: 0.3           # dolna granica strefy wejścia = close - k*ATR
  entry_above_atr: 0.2           # górna granica = close + k*ATR
  sl_atr: 1.5                    # SL = entry_min - k*ATR (lub poniżej swing low)
  sl_swing_buffer_atr: 0.2
  max_sl_pct: 8.0                # SL dalej niż X% od środka wejścia -> odrzucamy
  r_multiples: [1.0, 2.0, 3.0]   # T1, T2, T3 jako wielokrotności ryzyka R
  resistance_snap_r: 0.5         # opór w odległości < k*R poniżej celu "przyciąga" cel
  swing_window: 5
  swing_lookback: 120

filters:
  min_avg_turnover_pln: 1000000  # średni obrót 20 sesji
  min_rr_t1: 1.0
  require_above_sma50: true
  strong_catalyst_override: 0.8  # siła >= tej wartości zwalnia z filtra SMA50
  min_volume_ratio: 1.2          # wolumen ostatniej sesji / średnia 20
  max_gap_pct: 6.0               # jeśli kurs już wystrzelił, nie gonimy
  block_bear_regime: true
  cooldown_days: 5               # max 1 aktywny sygnał na spółkę w tym okresie
  max_signals_per_day: 5
  min_score: 0.55

processing:
  max_news_age_hours: 12         # nieprzetworzone newsy starsze niż to -> "nieaktualny"
  max_attempts: 3                # ponowienia po błędach przejściowych (API, sieć, notowania)

prefilter:                       # szum ESPI odrzucany przed agentem (reguły: prefilter.py)
  enabled: true
  min_insider_value_pln: 200000  # mniejsze transakcje osób blisko związanych = szum

tracker:
  breakeven_after_t1: false      # po T1 stop na środek strefy wejścia (od następnej sesji)
  weekly_summary: false          # tygodniowe podsumowanie skuteczności na kanale
  weekly_summary_day: fri
  weekly_summary_at: "19:00"     # po trackerze (schedule.tracker_at)

publish:
  enabled: true                  # wyłącznik awaryjny
  max_pending_minutes: 60        # sygnał nieopublikowany dłużej -> "unpublished", bez wysyłki
  use_test_channel: true         # NA START: publikuj na kanał testowy
  include_thesis: true
  post_outcomes: true            # "✅ T1 osiągnięty" itd.
  disclaimer: >-
    Materiał ma charakter informacyjny i nie stanowi rekomendacji inwestycyjnej ani porady.
    Sygnał wygenerowany automatycznie. Inwestowanie wiąże się z ryzykiem utraty kapitału.
