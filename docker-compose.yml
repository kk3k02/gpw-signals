services:
  gpw-signals:
    build: .
    image: gpw-signals:latest
    container_name: gpw-signals
    restart: unless-stopped
    env_file: .env
    environment:
      TZ: Europe/Warsaw
      # Ollama na hoście (agent.provider: ollama); localhost z settings.yaml to w kontenerze sam kontener
      OLLAMA_BASE_URL: http://host.docker.internal:11434
    extra_hosts:                # host.docker.internal także poza Docker Desktop (Linux)
      - "host.docker.internal:host-gateway"
    healthcheck:                # znacznik ostatniego udanego cyklu (monitoring.heartbeat_file)
      test: ["CMD", "python", "-m", "gpw_signals", "health"]
      interval: 5m
      timeout: 30s
      retries: 2
      start_period: 40m         # pierwszy import notowań trwa ok. 20 min
    volumes:
      - ./config:/app/config:ro
      - ./data:/app/data        # baza SQLite, tickery, kalendarz, notowania
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
