[project]
name = "gpw-signals"
version = "0.1.0"
description = "Sygnalista GPW: agent Claude ocenia newsy, algorytm wyznacza poziomy, bot publikuje na Telegramie."
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.0",
    "httpx>=0.27",
    "feedparser>=6.0",
    "pandas>=2.2",
    "numpy>=1.26",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "apscheduler>=3.10,<4",
    "rapidfuzz>=3.9",
    "tenacity>=8.3",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "respx>=0.21", "ruff>=0.5"]

[project.scripts]
gpw-signals = "gpw_signals.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gpw_signals"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
